# Enable WeAct E-Paper display driver
CONFIG_WEACT_EPAPER=y

# Enable SPI
CONFIG_SPI=y

# Enable GPIO
CONFIG_GPIO=y

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y

# Increase main stack size for display operations
CONFIG_MAIN_STACK_SIZE=4096

# Enable heap for dynamic memory allocation
CONFIG_HEAP_MEM_POOL_SIZE=8192
